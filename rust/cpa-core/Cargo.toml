[package]
name = "cpa-core"
description = "CPA model, editing logic, certificates and validation of the CPA Editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
encoding_rs = "0.8.35"
native-tls = "0.2.18"
num-bigint = "0.4"  # same major version as x509-parser uses
quick-xml = "0.37"
regex = "1.13.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "json"] }
uuid = { version = "1.20.0", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
pkg-config = "0.3.34"

[target."cfg(windows)".build-dependencies]
vcpkg = "0.2.15"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }
