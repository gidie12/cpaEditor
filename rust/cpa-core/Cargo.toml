[package]
name = "cpa-core"
description = "CPA model, editing logic, certificates and validation of the CPA Editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
native-tls = "0.2.18"
num-bigint = "0.4"  # same major version as x509-parser uses
quick-xml = "0.37"
regex = "1.13.2"
serde_json = "1.0.154"
thiserror = "2"
ureq = { version = "3.2.1", default-features = false, features = ["native-tls", "json"] }
uuid = { version = "1.20.0", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
