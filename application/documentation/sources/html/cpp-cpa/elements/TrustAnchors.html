<h1>Trust Anchors</h1>
<h2>Description</h2>
<p>The <code>TrustAnchors</code> element is used to define the trust anchors for a collaboration protocol agreement.</p>
<h2>Attributes</h2>
<ul>
<li><code>anchorId</code>: The unique identifier for the trust anchor.</li>
<li><code>description</code>: A brief description of the trust anchor.</li>
</ul>
<h2>Example</h2>
<p>```xml
<TrustAnchors anchorId="12345" description="Trust anchor for the agreement" /></p>
