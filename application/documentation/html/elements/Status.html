<h1>Status</h1>
<h2>Attributes</h2>
<ul>
<li><code>value</code>: The status value <a href="CommonTypes.html">statusValue.type</a>.
The possible values for the value attribute of the Status element are:
agreed, signed, proposed</li>
</ul>
<h2>Example</h2>
<pre><code class="language-xml">&lt;Status value=&quot;agreed&quot; /&gt;
</code></pre>
