<h1>CollaborationProtocolProfile</h1>
<h2>Attributes</h2>
<ul>
<li><code>cppid</code>: A unique identifier for the CPP.</li>
<li><code>version</code>: The version of the CPP.</li>
</ul>
<h2>Sub-elements</h2>
<ul>
<li><code>PartyInfo</code> (unbounded)</li>
<li><code>SimplePart</code> (unbounded)</li>
<li><code>Packaging</code> (unbounded)</li>
<li><code>Signature</code> (optional)</li>
<li><code>Comment</code> (optional, unbounded)</li>
</ul>
