<h1>SignatureAlgorithm</h1>
<h2>Attributes</h2>
<ul>
<li><code>oid</code>: The OID of the signature algorithm (optional).</li>
<li><code>w3c</code>: The W3C identifier of the signature algorithm (optional).</li>
<li><code>enumerationType</code>: The enumeration type of the signature algorithm (optional).</li>
</ul>
