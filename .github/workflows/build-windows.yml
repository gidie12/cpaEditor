name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish this build as the nightly prerelease
        type: boolean
        default: false
  # Nightly build of the default branch; skipped when nothing changed since the previous one
  schedule:
    - cron: '0 2 * * *'
  pull_request:
  push:
    tags: ['v*']

# Read-only by default; only the release jobs get write access
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        run: |
          nightly_sha="$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
          if [ "$EVENT" = schedule ] && [ "$nightly_sha" = "$SHA" ]; then
            echo "The nightly build of $SHA already exists"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # All tags: a nightly build is numbered after the latest release
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-build.txt
      # A release reports the version of its tag in the title bar and in the update check. A nightly build reports
      # the latest release plus build information, for example 1.0.5+nightly.20261029.abc1234, so the update check
      # offers it the next release
      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not a version such as v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
          elif [ "$NIGHTLY" = true ]; then
            release="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || echo v0)"
            version="${release#v}+nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          else
            exit 0
          fi
          echo "Version $version"
          echo "__version__ = \"$version\"" > application/version.py
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
      - run: pyinstaller --noconfirm cpaEditor.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CpaEditor-windows
          path: dist/CpaEditor.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CpaEditor-windows
          path: dist
      # A tag with a label (v1.2.3-rc.1) is a prerelease: GitHub never shows it as the latest release, so the update
      # check of the application does not offer it
      - name: Publish release
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" dist/CpaEditor.exe --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" dist/CpaEditor.exe --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}

  nightly:
    if: github.event_name == 'schedule' || inputs.nightly == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CpaEditor-windows
          path: dist
      # One nightly prerelease that is replaced by every build; as a prerelease it is never offered as an update
      - name: Publish nightly prerelease
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/CpaEditor.exe --prerelease --latest=false --target "$SHA" \
            --title "Nightly build" \
            --notes "Untested build of \`$BRANCH\` at $SHA, made on $(date -u +%Y-%m-%d). Not offered as an update by the CPA Editor; use a release for production."
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
