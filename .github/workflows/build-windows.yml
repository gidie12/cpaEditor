name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']

# Read-only by default; only the release job gets write access
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-build.txt
      # A release reports the version of its tag in the title bar and in the update check
      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version such as v1.2.3" >&2
            exit 1
          fi
          echo "__version__ = \"$version\"" > application/version.py
      - run: pyinstaller --noconfirm cpaEditor.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CpaEditor-windows
          path: dist/CpaEditor.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CpaEditor-windows
          path: dist
      - name: Publish release
        run: gh release create "$TAG" dist/CpaEditor.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
